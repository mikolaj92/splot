version = 1
id = "employment_contract_composer"
mode = "compose_one"
language = "pl"

[objective]
id = "final_contract_quality"
description = "Compose one commitment from compatible host-supplied candidate parts."

[[signals]]
id = "goal_fit"
provider = "candidate.value"
field = "goal_fit"
weight = 0.35
prefer = "higher"

[[signals]]
id = "completeness"
provider = "candidate.value"
field = "completeness"
weight = 0.25
prefer = "higher"

[[signals]]
id = "legal_risk"
provider = "candidate.value"
field = "legal_risk"
weight = 0.25
prefer = "lower"

[[signals]]
id = "style_consistency"
provider = "candidate.value"
field = "style_consistency"
weight = 0.15
prefer = "higher"

[[constraints]]
id = "candidate_available"
provider = "candidate.available"
severity = "block"
reason = "candidate is unavailable"

[decision]
policy = "constrained_weighted_score"

[compose]
min_score = 0.5
max_parts = 5

version = 1
id = "route_selector"
mode = "select_one"
language = "en"

[objective]
id = "best_processing_route"
description = "Select the available processing route with the best host-supplied fit and cost."

[[signals]]
id = "route_fit"
provider = "candidate.value"
field = "route_fit"
weight = 0.7
prefer = "higher"

[[signals]]
id = "route_cost"
provider = "candidate.value"
field = "route_cost"
weight = 0.3
prefer = "lower"

[[constraints]]
id = "route_available"
provider = "candidate.available"
severity = "block"
reason = "route unavailable"

[decision]
policy = "constrained_weighted_score"
close_margin = 0.04

[stability]
policy = "none"

[uncertainty]
when_close = "select_best_anyway"
when_constraints_block_all = "fallback"

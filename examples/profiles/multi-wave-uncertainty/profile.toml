version = 1
id = "multi_wave_uncertainty"
mode = "select_one"
language = "en"

[objective]
id = "enough_evidence_to_decide"
description = "Select only when partial waves agree enough."

[[signals]]
id = "support"
provider = "candidate.value"
field = "support"
weight = 0.8
prefer = "higher"

[[signals]]
id = "source_freshness"
provider = "candidate.value"
field = "source_freshness"
weight = 0.2
prefer = "higher"
min = 0.5

[[constraints]]
id = "source_not_stale"
signal = "source_freshness"
operator = "gte"
value = 0.5
severity = "warn"

[decision]
policy = "constrained_weighted_score"
close_margin = 0.1

[stability]
policy = "none"

[uncertainty]
when_close = "select_best_anyway"
when_constraints_block_all = "fallback"

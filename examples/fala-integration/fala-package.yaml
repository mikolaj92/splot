# Fala carrier package that hosts Splot as an arbitration step.
# Fala owns the runtime (carriers, observations, artifacts, events, gates,
# SQLite, filesystem artifacts). Splot only arbitrates inside the `decide` step.
version: "2"
id: splot_arbitration_example
title: Splot arbitration example

carrier_types:
  - id: splot.wave
    media_types:
      - application/json
    value_schema:
      type: object

observation_kinds:
  - id: splot.decision
    value_schema:
      type: object
      properties:
        status:
          type: string
        selected_candidate_id:
          type: [string, "null"]

artifact_kinds:
  - id: splot.decision_report
    media_types:
      - application/json
  - id: splot.state
    media_types:
      - application/json

capabilities:
  - id: splot.arbitrate
    accepts_carrier_types:
      - splot.wave
    emits_observation_kinds:
      - splot.decision
    emits_artifact_kinds:
      - splot.decision_report
      - splot.state

flows:
  - id: arbitrate
    steps:
      - id: decide
        capability: splot.arbitrate
        adapter:
          kind: subprocess
          command:
            - splot-fala-step
        config:
          profile: examples/profiles/player-camera-director
      - id: human_decision
        needs: [decide]
        capability: splot.arbitrate
        adapter:
          kind: manual_gate

runtime:
  backend:
    kind: sqlite
    path: .fala/splot.sqlite
  artifact_store:
    kind: filesystem
    root: .fala/artifacts

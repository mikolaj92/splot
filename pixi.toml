[workspace]
name = "splot"
version = "0.2.1"
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
mojo = "==1.0.0b3.dev2026071505"

[tasks]
core-round = "./tools/mojo_run.sh mojo/smoke/core_round.mojo"
fala-stdio = "./tools/mojo_run.sh mojo/smoke/fala_stdio.mojo"
full-smoke = "pixi run core-round && pixi run fala-stdio"

[workspace]
name = "splot"
version = "0.4.1"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
mojo = "==1.0.0"

[tasks]
setup-ember-json = "./tools/setup_ember_json.sh"
core-round = { cmd = "./tools/mojo_run.sh mojo/smoke/core_round.mojo", depends-on = ["setup-ember-json"] }
fala-stdio = { cmd = "./tools/mojo_run.sh mojo/smoke/fala_stdio.mojo", depends-on = ["setup-ember-json"] }
# One-shot step entry (fixture request → decision on stdout).
step-fixture = { cmd = "env SPLOT_REQUEST_PATH=examples/fixtures/player_camera_director.request.json ./tools/splot_step.sh", depends-on = ["setup-ember-json"] }
host-readers = { cmd = "./tools/mojo_run.sh mojo/smoke/host_readers.mojo", depends-on = ["setup-ember-json"] }
compose-envelope = { cmd = "./tools/mojo_run.sh mojo/smoke/compose_envelope.mojo", depends-on = ["setup-ember-json"] }
profile-contracts = { cmd = "./tools/mojo_run.sh mojo/smoke/profile_contracts.mojo", depends-on = ["setup-ember-json"] }
step-boundary = { cmd = "./tools/step_boundary_smoke.sh", depends-on = ["setup-ember-json"] }
full-smoke = "pixi run core-round && pixi run fala-stdio && pixi run host-readers && pixi run compose-envelope && pixi run profile-contracts && pixi run step-boundary"


name: Layout

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  mojo-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mojo-only product layout
        run: |
          test -d mojo/splot
          test -f mojo/splot/pipeline.mojo
          test -f mojo/splot/profile.mojo
          test -f mojo/splot/toml.mojo
          test ! -d src
          test ! -d tests
          test ! -d schemas
          ! find mojo examples -name '*.yaml' -o -name '*.yml' | grep -q .
          ! find . -path ./vendor -prune -o -path ./.git -prune -o -path ./.pixi -prune -o -name '*.py' -print | grep -v '^\./vendor' | grep -q .
          echo "layout ok: exclusive Mojo Splot (no Python product, no YAML)"

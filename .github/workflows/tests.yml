name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Run examples
        run: |
          python -m splot.cli profile validate examples/profiles/player-camera-director
          python -m splot.cli examples run camera --out /tmp/splot-camera-report.json
          python -m splot.cli audit-report /tmp/splot-camera-report.json
          python -m splot.cli examples run contract-compose
          python -m splot.cli examples run route
          python -m splot.cli examples run uncertainty
          PROCESS_RUNTIME_ARTIFACT_DIR=/tmp/splot-fala-artifacts splot-fala-step < examples/fala-integration/stdin.json > /tmp/splot-fala-output.json

name: Product CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  product:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.9.12
          tool_versions: |
            pixi 0.72.2
            uv 0.11.20
            python 3.12.12
      - run: ./tools/test_product.sh
      - run: mise exec pixi -- pixi run --locked step-fixture

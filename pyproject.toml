[project]
# Distribution name; the PyPI name `splot` is taken by an unrelated PySAL
# package, so publish as `splot-runtime`. The import package and console
# scripts stay `splot` / `splot-fala-step`.
name = "splot-runtime"
version = "0.1.0"
description = "Cybernetic information arbitration runtime: many signals in, one minimized-entropy decision out."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "mikolaj92" }
]
dependencies = []
keywords = ["arbitration", "cybernetics", "decision-support", "entropy", "evidence", "runtime", "profiles", "signals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.optional-dependencies]
# Splot stays standalone (dependencies = []); the real Fala runtime is optional.
# Public indexes reject direct Git URL dependencies in package metadata, so the
# published extra is dependency-free. Install Fala explicitly from GitHub when
# the fala.sdk-backed manifest-step path in splot.adapters.fala is desired.
# Without Fala installed, the import-free fallback runs, so Splot never
# hard-depends on Fala.
fala = []

[dependency-groups]
# Local/developer helper only; dependency groups are not published as wheel
# Requires-Dist metadata.
fala = ["fala @ git+https://github.com/mikolaj92/Fala.git@0.1.0"]

[project.urls]
Homepage = "https://github.com/mikolaj92/splot"
Repository = "https://github.com/mikolaj92/splot"
Issues = "https://github.com/mikolaj92/splot/issues"
Changelog = "https://github.com/mikolaj92/splot/blob/main/CHANGELOG.md"

[project.scripts]
splot = "splot.cli:main"
splot-fala-step = "splot.adapters.fala:run_stdio"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

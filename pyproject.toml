[project]
name = "splot"
version = "0.4.1"
description = "Generic fusion organ: Mojo engine + thin optional Python binding (fuse)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "mikolaj92" }]
dependencies = []
keywords = ["fusion", "entropy", "decision", "mojo", "cybernetics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mikolaj92/splot"
Repository = "https://github.com/mikolaj92/splot"
Issues = "https://github.com/mikolaj92/splot/issues"
Changelog = "https://github.com/mikolaj92/splot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/splot"]
# Ship Mojo sources so the binding can compile against the engine at first use.
force-include = { "mojo" = "mojo", "tools" = "tools", "patches" = "patches" }

[tool.hatch.build.targets.sdist]
include = [
  "python/splot",
  "mojo",
  "tools",
  "patches",
  "examples/fixtures",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pixi.toml",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]

[tool.lokay]
test = "./tools/test_product.sh"

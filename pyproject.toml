[project]
name = "splot"
version = "0.3.1"
description = "Standalone information arbitration runtime — product engine is Mojo (mojo/splot)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "mikolaj92" }]
dependencies = []
keywords = ["arbitration", "decision-support", "mojo", "cybernetics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Mojo",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mikolaj92/splot"
Repository = "https://github.com/mikolaj92/splot"
Issues = "https://github.com/mikolaj92/splot/issues"
Changelog = "https://github.com/mikolaj92/splot/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Metadata-only Python package; product modules live under mojo/splot.
[tool.hatch.build.targets.wheel]
only-include = ["README.md"]

[dependency-groups]
mojo = [
  "mojo==1.0.0b3.dev2026071505; sys_platform != 'win32'",
]

[[tool.uv.index]]
name = "modular-nightly"
url = "https://whl.modular.com/nightly/simple/"
explicit = true

[tool.uv.sources]
mojo = { index = "modular-nightly" }

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"

[project]
name = "splot"
version = "0.1.0"
description = "Generic information arbitration runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "mikolaj92" }
]
dependencies = []

[project.scripts]
splot = "splot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
